[tools]
# Use exact versions for reproducibility across environments
go = "1.26.6"
golangci-lint = "2.13.1"
git-cliff = "2.13.1"
goreleaser = "2.18.0"
# Required for GoReleaser SBOM generation and signing
syft = "1.51.0"
cosign = "2.6.5"
hugo = "0.165.0"
# Docs tooling: docs-map driver (yq) and rendered-site link checker (lychee)
yq = "4.53.6"
lychee = "0.24.2"

[env]
GOBIN = "{{config_root}}/.bin"
PATH = "{{config_root}}/.bin:{{env.PATH}}"

[tasks.build]
description = "Build all executables"
run = "make build"

[tasks.test]
description = "Run all tests"
run = "make test"

[tasks.lint]
description = "Run linter"
run = "make lint"

[tasks.tidy]
description = "Tidy go modules"
run = "make tidy"

[tasks.check]
description = "Quick pre-commit check"
run = "make check"

[tasks.check-kure-dep-sync]
description = "Guard: launcher must not newly lead imported kure on shared direct deps"
run = "make check-kure-dep-sync"

[tasks.verify]
description = "Run all checks (tidy, lint, test, kure dep sync)"
depends = ["tidy", "lint", "test", "check-kure-dep-sync"]

[tasks.changelog]
description = "Generate changelog from git history"
run = "git cliff -o CHANGELOG.md"

[tasks.changelog-preview]
description = "Preview changelog changes"
run = "git cliff --unreleased"

[tasks.release]
description = "Release workflow (dry-run by default, --do-it to trigger CI)"
run = "./scripts/release-trigger.sh"
raw = true
