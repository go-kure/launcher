[tools]
# Use exact versions for reproducibility across environments
go = "1.26.8"
golangci-lint = "2.14.0"
git-cliff = "2.14.2"
goreleaser = "2.18.2"
# Required for GoReleaser SBOM generation and signing
syft = "1.54.1"
cosign = "2.6.5"
hugo = "0.167.0"
# Docs tooling: docs-map driver (yq) and rendered-site link checker (lychee)
yq = "4.54.1"
lychee = "0.24.2"
# flux CLI, for the `flux schema validate` plugin used by `make validate-manifests`
# (site/scripts/validate-manifests.sh installs/pins the `schema` plugin itself)
flux2 = "2.9.6"

[env]
GOBIN = "{{config_root}}/.bin"
PATH = "{{config_root}}/.bin:{{env.PATH}}"

[tasks.build]
description = "Build all executables"
run = "make build"

[tasks.test]
description = "Run all tests"
run = "make test"

[tasks.lint]
description = "Run linter"
run = "make lint"

[tasks.tidy]
description = "Tidy go modules"
run = "make tidy"

[tasks.check]
description = "Quick pre-commit check"
run = "make check"

[tasks.check-kure-dep-sync]
description = "Guard: launcher must not newly lead imported kure on shared direct deps"
run = "make check-kure-dep-sync"

[tasks.check-tool-versions]
description = "Verify golangci-lint pin parity (Makefile/ci.yml/docs) against mise.toml"
run = "make check-tool-versions"

[tasks.sync-tool-versions]
description = "Sync golangci-lint pins (Makefile/ci.yml/docs) from mise.toml"
run = "make sync-tool-versions"

[tasks.check-govulncheck-docs]
description = "Verify govulncheck version parity (docs/github-workflows.md) against ci.yml"
run = "make check-govulncheck-docs"

[tasks.sync-govulncheck-docs]
description = "Sync govulncheck doc mentions (docs/github-workflows.md) from ci.yml"
run = "make sync-govulncheck-docs"

[tasks.check-doc-fences]
description = "Check the documentation's marked YAML fences (self-test, then the tree)"
run = "make check-doc-fences"

[tasks.test-verify-merge]
description = "Self-test scripts/verify-merge.sh against a throwaway fixture repository"
run = "make test-verify-merge"

[tasks.test-pin-impact]
description = "Run scripts/check-pin-impact.sh's hermetic cases (stub curl, throwaway git repositories, no network)"
run = "make test-pin-impact"

[tasks.check-issue-refs]
description = "Reject bare #N and ownerless repo#N references (self-test, the tree, then commit messages since ISSUE_REFS_BASE)"
run = "make check-issue-refs"

[tasks.vendor-k8s-defaulters]
description = "Re-fetch the Kubernetes defaulter excerpt the components defaulted-zero tests read (mise run vendor-k8s-defaulters vX.Y.Z; never run by CI)"
run = "bash scripts/vendor-k8s-defaulters.sh"

[tasks.verify]
description = "Run all checks (tidy, lint, test, kure dep sync, tool pins, doc fences, verify-merge self-test, pin-impact cases, issue refs)"
depends = ["tidy", "lint", "test", "check-kure-dep-sync", "check-tool-versions", "check-govulncheck-docs", "check-doc-fences", "test-verify-merge", "test-pin-impact", "check-issue-refs"]

[tasks.verify-merge]
description = "Build and test a PR's merge ref, the tree its CI builds (mise run verify-merge <pr-number>)"
run = "bash scripts/verify-merge.sh"

# No task writes CHANGELOG.md: the shared Release workflow's release script
# prepends each release's section and published sections are never
# regenerated (go-kure/launcher#561). Releasing: docs/releasing.md.
[tasks.changelog-preview]
description = "Preview changelog changes"
run = "git cliff --unreleased"
