# versions.yaml - Version metadata validated by scripts/sync-versions.sh check
# (run in CI's lint job; it also asserts the README badge matches go.mod).

# Go version (mise.toml is authoritative for tooling; go.mod must match this)
go:
  current: "1.26.7"
# Deliberately empty: every infrastructure dependency launcher imports is a
# direct dep shared with the imported kure, whose version policy is kure-led —
# the ceiling rule is enforced by site/scripts/check-kure-dep-sync.sh and the
# supported ranges are documented in kure's own versions.yaml. Add entries here
# only for infrastructure deps launcher acquires that kure does not have.
infrastructure: {}
