# golangci-lint configuration for Launcher
# Aligned with the downstream platform's golangci-lint standard
# and a downstream consumer's linter set

version: "2"

run:
  modules-download-mode: readonly

linters:
  enable:
    # Default linters (listed explicitly per the downstream platform standard)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional required linters (aligned with a downstream consumer)
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - misspell
    - nilerr
    - unconvert
    - whitespace
    # Optional linters (launcher-specific, not required by the downstream platform standard)
    - gosec
    # Lowering purity (D5, docs/oam/design-lowering-engine.md): a lowering rule's
    # output is a function of its four inputs, so rule code reads no clock,
    # environment, file, network or randomness. Scoped by exclusions.rules below.
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.(Now|Since|Until)$'
          msg: a lowering rule must not read the clock
        - pattern: '^os\.(Getenv|LookupEnv|Environ|ExpandEnv|UserHomeDir|TempDir|UserCacheDir|UserConfigDir|Getwd|Hostname|Executable|Args)$'
          msg: a lowering rule must not read the environment
        - pattern: '^(os\.(ReadFile|Open|OpenFile|Stat|Lstat|ReadDir|DirFS|Readlink)|((path/)?filepath|(io/)?ioutil)\.(Glob|Walk|WalkDir|ReadFile|ReadDir|EvalSymlinks))$'
          msg: a lowering rule must not read the filesystem
        - pattern: '^net\.(Dial\w*|Listen\w*|Lookup\w*|DefaultResolver|Resolver|Interface\w*)$'
          msg: a lowering rule must not use the network
        - pattern: '^(net/)?http\.(Get|Head|Post|PostForm|DefaultClient|DefaultTransport|Client|Transport)$'
          msg: a lowering rule must not use the network
        - pattern: '^((math|crypto)/)?rand(/v2)?\.'
          msg: a lowering rule must not use randomness (math/rand, math/rand/v2, crypto/rand)
    errcheck:
      check-type-assertions: false
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # CLI tool reads files from user-provided paths — not a vulnerability
        - G304
        # Manifest/config files need 0644 (world-readable), not 0600
        - G306
        # Standard 0755 directory permissions
        - G301
    staticcheck:
      checks:
        - "all"
        # gosimple (S*) checks are included via "all" — gosimple was merged
        # into staticcheck in golangci-lint v2
        - "-QF*"
        - "-ST*"
  exclusions:
    generated: lax
    rules:
      # Test files have relaxed rules
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      # forbidigo applies to lowering rule code only: the built-in component and
      # trait packages and the engine's lowering*.go. kurel and pkg/io read files
      # and the environment on purpose.
      - linters:
          - forbidigo
        path-except: ^pkg/oam/(builtin/(components|traits)/|lowering[^/]*\.go$)
      - linters:
          - forbidigo
        path: _test\.go
      # Per-file exceptions, each with its reason:
      # manifestsource.go fetches a manifest URL for the terminal manifests and crd
      # handlers' Generate (parseManifestSource); no lowering rule calls it.
      - linters:
          - forbidigo
        path: ^pkg/oam/builtin/components/manifestsource\.go$
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/go-kure/launcher
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
