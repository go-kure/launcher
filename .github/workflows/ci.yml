name: CI

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]
    # No draft gate below (2026-08-19, GitLab mr-review parity) — every job runs
    # on a draft PR the same as a ready one, so ready_for_review buys nothing
    # here and is left out of the default set (opened, synchronize, reopened).
    # labeled/unlabeled added (2026-08-30, chatgpt-codex-connector review on
    # go-kure/kure#729): without them, adding the pin-impact job's
    # 'pin-impact-ack' override label doesn't start a new run, so the
    # required `build` check stays failed until an unrelated push — the
    # acknowledgement path existed but nothing re-evaluated it. This does
    # mean ANY label add/remove on a PR reruns the whole pipeline, not just
    # pin-impact — accepted: label changes are rare, deliberate maintainer
    # actions, not routine PR activity.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:  # required: checks must report on the merge queue's temporary branch
  schedule:
    - cron: '0 4 * * *'  # 4am UTC daily - catch external changes
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # Go version is read from mise.toml (single source of truth)
  # GO_VERSION is set dynamically in each job that needs it
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  # Several repos across both forges install this same scanner and share the
  # govulncheck-gate action, but nothing compares their pins. A bump therefore has
  # to be mirrored by hand in each workflow that installs it, this one included.
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: 'v1.7.0'
  # The runner binary patch (Runner.Worker.dll) renames all occurrences of
  # ACTIONS_RESULTS_URL to ACTIONS_RESULTS_ORL, including the name the Worker
  # injects into step process environments.  Workflow env overrides runner-injected
  # values, so setting ACTIONS_RESULTS_URL here ensures upload-artifact,
  # download-artifact, and cache (v2) all see the correct in-cluster URL.
  ACTIONS_RESULTS_URL: 'http://actions-cache-server.arc-runners.svc.cluster.local:3000/'

# Avoid duplicate runs on the same commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Pre-flight: Detect Changed Paths
  # =============================================================================

  changes:
    name: detect-changes
    runs-on: autops-kube-kure
    timeout-minutes: 2
    # On merge_group there is no PR base to diff against; dorny/paths-filter would
    # error. Skip the filter and force both outputs to 'true' so every gating job
    # runs in the queue — otherwise required checks never report and merges hang.
    outputs:
      go: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.go }}
      docs: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.docs }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      if: github.event_name != 'merge_group'
      id: filter
      with:
        filters: |
          go:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - 'Makefile'
            - '.github/workflows/**'
            - 'site/scripts/check-kure-dep-sync.sh'
            - 'site/scripts/kuredepsync/**'
            # The version-consistency check in `validate` reads all of these; a
            # metadata-only PR (or a README badge edit) must not be able to skip it.
            - 'versions.yaml'
            - 'docs/compatibility.md'
            - 'scripts/sync-versions.sh'
            - 'README.md'
            # validate-manifests builds these via `kurel build` and schema-validates
            # the output — a PR touching only these must not be able to skip it.
            - 'examples/**'
            - 'site/scripts/validate-manifests.sh'
            # check-tool-versions (golangci-lint pin parity) reads all of these;
            # a PR touching only one must not be able to skip the lint job it
            # runs in — that would leave the checker unexercised on exactly the
            # class of edit most likely to break it.
            - 'mise.toml'
            - 'scripts/check-tool-versions.sh'
            - 'scripts/sync-tool-versions.sh'
            - 'docs/github-workflows.md'
            - 'DEVELOPMENT.md'
            # check-govulncheck-docs (govulncheck version parity, ci.yml vs the doc) reads
            # these two scripts plus ci.yml/docs/github-workflows.md, both already listed above.
            - 'scripts/check-govulncheck-docs.sh'
            - 'scripts/sync-govulncheck-docs.sh'
          docs:
            - 'site/**'
            - 'docs/**'
            - '**.md'
            - 'pkg/**'
            - 'cmd/**'
            - 'scripts/**'
            - '.github/workflows/**'
            - '.github/actions/**'
            - '**.json'
            - '**.yml'
            - '**.yaml'
            - '**.toml'

  # =============================================================================
  # Stage 1: Fast Validation
  # =============================================================================

  validate:
    name: lint
    runs-on: autops-kube-kure
    timeout-minutes: 20
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    # Source-aware Go build cache (distinct job prefix so lint and test don't overwrite
    # each other's entry). See the test job for the design rationale.
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-validate-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-validate-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-validate-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install dependencies
      run: make deps

    - name: Check Go version consistency
      run: make check-go-version

    - name: Check tool version parity
      run: make check-tool-versions

    - name: Check govulncheck docs
      run: make check-govulncheck-docs

    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-4.44.6-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Validate version consistency
      run: ./scripts/sync-versions.sh check

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@latest

    - name: Check formatting
      run: |
        make fmt
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::Code is not properly formatted. Run 'make fmt' to fix."
          git diff
          exit 1
        fi

    - name: Check go mod tidy
      run: |
        make tidy
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "::error::go.mod or go.sum is not tidy. Run 'make tidy' to fix."
          git diff go.mod go.sum
          exit 1
        fi

    - name: Run go vet
      run: make vet

    - name: Check kuredepsync helper module
      run: |
        cd site/scripts/kuredepsync
        GOWORK=off go mod tidy
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "::error::kuredepsync go.mod/go.sum not tidy. Run 'go mod tidy' in site/scripts/kuredepsync."
          git diff go.mod go.sum
          exit 1
        fi
        GOWORK=off go vet ./...
        GOWORK=off go test ./...

    # Blocking on PR / merge-queue: fail only when the change newly leads imported kure
    # on a shared direct dep. The script fetches its own base ref.
    - name: Check launcher not newly ahead of imported kure
      if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
      env:
        BASE_REF: ${{ github.base_ref || 'main' }}
      run: bash site/scripts/check-kure-dep-sync.sh --base "origin/${BASE_REF}"

    # Visibility only on push / schedule (base merge-base can equal HEAD → no-op diff).
    - name: Report launcher-kure shared-dep lead
      if: github.event_name == 'push' || github.event_name == 'schedule'
      run: bash site/scripts/check-kure-dep-sync.sh --report

    - name: Fetch base branch for diff-based lint
      if: github.event_name == 'pull_request'
      run: git fetch origin ${{ github.base_ref }} --depth=1

    - name: Run linters
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          make lint LINT_FLAGS="--new-from-rev=origin/${{ github.base_ref }}"
        else
          make lint
        fi

    - name: Save Go build cache
      if: success() && steps.gocache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

  action-pins:
    name: action-pins
    runs-on: autops-kube-kure
    timeout-minutes: 2
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Check action pins
      uses: go-kure/.github/.github/actions/check-action-pins@cb7db3637c3e7a5cddf7d2599d11faef3be74465 # main

  pin-impact:
    name: pin-impact
    runs-on: autops-kube-kure
    timeout-minutes: 3
    # PR-only: needs a base-ref diff, which merge_group events don't carry
    # the same way pull_request events do. By the time a PR reaches the
    # merge queue this job has already gated it via `build` against the same
    # base it will actually merge onto — usually no new information from a
    # merge_group re-run. The gap this doesn't cover: two PRs landing in the
    # same queue batch where one adds a go-kure/.github action reference (or
    # a script gains a new `source`) and the other bumps the pin, and
    # neither alone sees both changes — narrow, and re-running here needs
    # deriving the merge group's own base/head from
    # `github.event.merge_group.*` rather than `github.base_ref`, which this
    # job doesn't do today. Tracked: go-kure/kure#730 (chatgpt-codex-
    # connector review on go-kure/kure#729, 2026-08-30).
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    # Binds the ack to the SHA it was actually reviewed at: any new push
    # (synchronize) strips the label, so a stale ack from a prior commit
    # can't silently cover a later, unreviewed diff. A maintainer re-adds
    # the label (a fresh 'labeled' event) once they've reviewed the new
    # head. Fixes chatgpt-codex-connector's go-kure/launcher#363 review
    # finding (2026-08-30): the ack was previously derived from the event
    # payload's label snapshot alone, with nothing to invalidate it across
    # pushes.
    - name: Strip stale pin-impact-ack on new commits
      if: github.event.action == 'synchronize'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label pin-impact-ack

    - name: Render and gate on go-kure/.github pin impact
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_REF: ${{ github.base_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # Live-query current labels rather than trusting the event payload
        # snapshot, so the strip above (same run, same job) is reflected
        # immediately instead of one run later. Maintainer-controlled
        # override, same convention as check-doc-gate's docs-skip label:
        # add 'pin-impact-ack' after reviewing a real hit to merge anyway.
        # See check-pin-impact.sh's PIN_IMPACT_ACK handling.
        if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx pin-impact-ack; then
          export PIN_IMPACT_ACK=true
        else
          export PIN_IMPACT_ACK=false
        fi
        ./scripts/check-pin-impact.sh --base-ref "origin/$BASE_REF" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Stage 2: Tests and Security (parallel with lint)
  # =============================================================================

  test:
    name: test
    runs-on: autops-kube-kure
    timeout-minutes: 25
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends build-essential

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    # Source-aware Go build cache. Warmed on push-to-main (main-scoped, restorable by both
    # PR and merge_group runs); restore-keys fall back deps-first then job-prefix. Split
    # restore/save so we can log exact vs fallback via cache-matched-key.
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-test-race-cover-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-test-race-cover-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-test-race-cover-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install dependencies
      run: make deps

    - name: Run tests
      run: |
        set -euo pipefail
        mkdir -p coverage
        go test -v -race -coverprofile=coverage/coverage.out -covermode=atomic -timeout 5m ./... 2>&1 | tee /tmp/gotest.log

    # Save only on non-exact restore (fallback/miss) and only if the run succeeded, so a
    # broken build never publishes a cache. Refreshes the per-tree entry for main-warming.
    - name: Save Go build cache
      if: success() && steps.gocache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

    - name: Upload test log
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      continue-on-error: true
      with:
        name: test-log
        path: /tmp/gotest.log
        if-no-files-found: warn

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      continue-on-error: true
      with:
        name: coverage
        path: coverage/coverage.out
        retention-days: 7

  security:
    name: Security
    runs-on: autops-kube-kure
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    # GOMEMLIMIT keeps Go's GC under the runner pod memory limit so govulncheck doesn't get
    # OOMKilled on the in-cluster ARC runner. Pairs with the 6Gi ARC runner limit.
    env:
      GOMEMLIMIT: 5GiB

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    # Source-aware Go build cache. govulncheck's symbol scan compiles the whole program,
    # so a warm build cache cuts this job materially (it had no caching before).
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-security-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-security-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-security-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install scan tools
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
        command -v jq &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends jq)

    - name: Run govulncheck
      run: |
        # A separate human-readable `-scan symbol ./...` run used to precede this
        # one, purely for the log. Dropped: it re-ran the exact same, potentially
        # slow scan a second time for no signal the gate step below doesn't already
        # print (every reachable and allowed OSV ID, plus a fix hint).
        #
        # In JSON mode a completed scan exits 0 whether or not it found anything
        # reachable — reachable findings alone do not produce a nonzero exit here.
        # So a nonzero exit means govulncheck itself failed (package load error,
        # vuln-db fetch failure, a Go/govulncheck version mismatch, …), and the
        # report file can still be non-empty, parseable JSON with zero findings in
        # that case — a silently "clean" result from a scan that never completed.
        # That is caught here explicitly: the gate can only tell "empty/unparseable"
        # from "well-formed", not "well-formed but cut short".
        set +e
        govulncheck -scan symbol -format json ./... > govulncheck.json 2> govulncheck.err
        scan_rc=$?
        set -e
        if [ "$scan_rc" -ne 0 ]; then
          echo "::error::govulncheck exited $scan_rc — scan did not complete"
          cat govulncheck.err
          exit 1
        fi
        if [ ! -s govulncheck.json ]; then
          echo "::error::govulncheck produced no JSON output"
          cat govulncheck.err
          exit 1
        fi

    - name: Gate on reachable vulnerabilities
      uses: go-kure/.github/.github/actions/govulncheck-gate@cb7db3637c3e7a5cddf7d2599d11faef3be74465 # main
      with:
        report: govulncheck.json
        # Accepted-risk advisories: reachable under symbol scan but not exploitable in Launcher's use.
        # Every entry MUST carry a justification.
        # GO-2026-5377: privilege escalation in the external-secrets *controller* reconciler.
        #   Launcher only imports the apis module to generate CRD manifests; reachable traces run
        #   through generated deepcopy boilerplate and package registration/init paths, never a
        #   reconciler. No upstream fix in the Go vuln DB (Fixed in: N/A), and the apis module is
        #   untagged so no bump can clear it — see docs/github-workflows.md.
        allowlist: 'GO-2026-5377'

    - name: Save Go build cache
      if: success() && steps.gocache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

    - name: Check for outdated dependencies
      run: make outdated

    - name: Check for sensitive files
      run: |
        # Check for common sensitive patterns
        if grep -r -i "password\|secret\|token\|key" --include="*.go" --include="*.yaml" --include="*.yml" . | grep -v "test" | grep -v "_test.go" | grep -E "(=|:)" | head -10; then
          echo "::warning::Potential sensitive information found in code. Please review."
        fi

  # =============================================================================
  # Stage 3: Coverage Check
  # =============================================================================

  coverage-check:
    name: Coverage Check
    runs-on: autops-kube-kure
    timeout-minutes: 5
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Download coverage artifact
      id: download-coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      continue-on-error: true
      with:
        name: coverage
        path: coverage/

    - name: Check coverage threshold
      id: coverage
      run: |
        if [ ! -f coverage/coverage.out ]; then
          echo "::warning::Coverage artifact not available (artifact upload may have failed on runner)"
          echo "coverage=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        COVERAGE=$(go tool cover -func=coverage/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
        THRESHOLD=80
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Current coverage: ${COVERAGE}%"
        echo "Required threshold: ${THRESHOLD}%"

        if [ "${COVERAGE%.*}" -lt "$THRESHOLD" ]; then
          echo "::error::Test coverage ${COVERAGE}% is below required threshold of ${THRESHOLD}%"
          exit 1
        else
          echo "::notice::Test coverage ${COVERAGE}% meets required threshold"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: ./coverage/coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: coverage
        message: |
          ## Test Coverage Report

          **Total Coverage:** ${{ steps.coverage.outputs.coverage }}%

          Coverage threshold: 80%

  # =============================================================================
  # Stage 4: Build (parallel with coverage-check)
  # =============================================================================

  build-binaries:
    name: Build kurel
    runs-on: autops-kube-kure
    timeout-minutes: 10
    needs: [changes, test]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    # Source-aware Go build cache (build prefix, shared with cross-platform per-arch).
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-build-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-build-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-build-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install dependencies
      run: make deps

    - name: Build kurel
      run: make build-kurel

    - name: Save Go build cache
      if: success() && steps.gocache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: kurel-linux-amd64
        path: bin/kurel
        retention-days: 7

  docs-build:
    name: docs-build
    runs-on: autops-kube-kure
    timeout-minutes: 15
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Shared org action; always scans --full-tree so a PR and the merge queue see
    # identical results (go-kure/.github → docs/standards.md, scan-parity MUST rule).
    - name: Check for downstream references
      uses: go-kure/.github/.github/actions/check-forbidden-terms@cb7db3637c3e7a5cddf7d2599d11faef3be74465 # main

    # Pinned to the SAME commit as the action above, not to 'main': the gate only
    # scans what that pinned SHA's script can see, so diffing the vendored copy
    # against a moving main would go red the instant canonical drifts further,
    # before the pin catches up — that's what reddened main on 2026-08-22. Bumping
    # the action pin above and this ref are one deliberate act, not two — and since
    # 2026-08-23 that act only has to happen once: the ref below is derived from the
    # action pin's own digest rather than duplicated by hand, so Renovate (or anyone)
    # bumping the pin above can no longer leave this one behind
    # (go-kure/launcher#298, go-kure/launcher#304).
    #
    # The release script (scripts/release.sh) still calls the vendored copy of the
    # guard; keep it byte-identical to the canonical so the release preflight can't rot.
    - name: Resolve pinned guard revision
      id: guardrev
      run: |
        sha=$(grep -oP 'check-forbidden-terms@\K[0-9a-f]{40}' .github/workflows/ci.yml || true)
        if [ -z "$sha" ]; then
          echo "::error::could not extract the check-forbidden-terms action pin from ci.yml — refusing to fall back to an unpinned ref" >&2
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Verify vendored guard matches canonical
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: go-kure/.github
        ref: ${{ steps.guardrev.outputs.sha }}
        path: .tmp/go-kure-dot-github
    - name: Diff vendored guard vs canonical
      run: diff -u .tmp/go-kure-dot-github/scripts/check-forbidden-terms.sh site/scripts/check-forbidden-terms.sh

    - name: Read Hugo version from mise.toml
      id: hugo-version
      run: |
        HUGO_VER=$(grep '^hugo = ' mise.toml | sed 's/hugo = "\(.*\)"/\1/')
        if [ -z "$HUGO_VER" ]; then
          echo "::error::Failed to parse Hugo version from mise.toml"
          exit 1
        fi
        echo "version=$HUGO_VER" >> $GITHUB_OUTPUT

    - name: Restore Hugo from cache
      id: hugo-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/hugo-bin
        key: hugo-${{ steps.hugo-version.outputs.version }}-linux-amd64

    - name: Install Hugo CLI
      if: steps.hugo-cache.outputs.cache-hit != 'true'
      run: |
        HUGO_VER="${{ steps.hugo-version.outputs.version }}"
        curl -fsSL -o ${{ runner.temp }}/hugo.deb \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VER}/hugo_extended_${HUGO_VER}_linux-amd64.deb"
        sudo dpkg -i ${{ runner.temp }}/hugo.deb
        mkdir -p ${{ runner.temp }}/hugo-bin
        cp /usr/local/bin/hugo ${{ runner.temp }}/hugo-bin/hugo

    - name: Add cached Hugo to PATH
      if: steps.hugo-cache.outputs.cache-hit == 'true'
      run: sudo install ${{ runner.temp }}/hugo-bin/hugo /usr/local/bin/hugo

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-4.44.6-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Validate docs map (code↔docs sync)
      uses: go-kure/.github/.github/actions/check-doc-sync@cb7db3637c3e7a5cddf7d2599d11faef3be74465 # main

    - name: Inject front matter
      run: bash site/scripts/inject-frontmatter.sh

    - name: Generate versions config overlay
      run: bash scripts/gen-versions-toml.sh --version dev

    - name: Cache Hugo modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ${{ runner.temp }}/hugo_cache
          ~/go/pkg/mod
        key: ${{ runner.os }}-hugo-${{ hashFiles('site/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-hugo-

    - name: Build Hugo site
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: hugo --config hugo.toml,versions.toml --minify --baseURL "https://www.gokure.dev/launcher/"

    - name: Upload docs artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: docs-site
        path: site/public/
        retention-days: 7

    - name: Cache lychee
      id: lychee-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/lychee
        key: lychee-0.24.2-linux-amd64

    - name: Install lychee
      if: steps.lychee-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o /tmp/lychee.tar.gz \
          https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
        tar xzf /tmp/lychee.tar.gz -C /tmp
        install -m755 /tmp/lychee-x86_64-unknown-linux-gnu/lychee ~/bin/lychee
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add lychee to PATH
      if: steps.lychee-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Build Hugo site (root-relative, for link check)
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
      run: hugo --baseURL "/" --destination .linkcheck --quiet

    - name: Check internal links (rendered site)
      uses: go-kure/.github/.github/actions/check-links@cb7db3637c3e7a5cddf7d2599d11faef3be74465 # main
      with:
        built-dir: site/.linkcheck

  doc-gate:
    name: doc-gate
    runs-on: autops-kube-kure
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-4.44.6-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Enforce docs-with-code (Layer 3)
      uses: go-kure/.github/.github/actions/check-doc-gate@cb7db3637c3e7a5cddf7d2599d11faef3be74465 # main
      with:
        base-ref: origin/${{ github.base_ref }}
        skip: ${{ contains(github.event.pull_request.labels.*.name, 'docs-skip') }}

  # =============================================================================
  # Manifest Schema Validation (non-blocking for its first cycle — go-kure/launcher#292)
  # =============================================================================

  validate-manifests:
    name: validate-manifests
    runs-on: autops-kube-kure
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    # Non-blocking for the first cycle: a flux-schema catalog gap (a real
    # Kubernetes/Flux field the tool's built-in schema doesn't yet know about)
    # should surface as visible, not immediately block every PR. Not added to
    # DEVELOPMENT.md's required-checks list either — see go-kure/launcher#292.
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Install dependencies
      run: make deps

    - name: Install Flux CLI + schema plugin
      uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4
      with:
        # Omitting `version:` resolves to the action's own "latest stable" at
        # workflow-run time (action.yml), not the SHA-pinned action's own
        # release — that would let CI run a different Flux CLI than the one
        # pinned for local use in mise.toml. Pin explicitly and keep both in
        # sync by hand on any re-pin.
        version: 2.9.4
        # Must match SCHEMA_PLUGIN_VERSION in site/scripts/validate-manifests.sh —
        # keep both in sync by hand on any re-pin.
        plugins: schema@0.12.1

    - name: Validate generated manifests against flux-schema
      run: make validate-manifests

  build:
    name: build
    runs-on: autops-kube-kure
    timeout-minutes: 1
    needs: [validate, test, build-binaries, docs-build, coverage-check, doc-gate, action-pins, security, pin-impact]
    if: always()
    steps:
    - name: Check build results
      run: |
        vl="${{ needs.validate.result }}"
        tt="${{ needs.test.result }}"
        bb="${{ needs.build-binaries.result }}"
        db="${{ needs.docs-build.result }}"
        cc="${{ needs.coverage-check.result }}"
        dg="${{ needs.doc-gate.result }}"
        ap="${{ needs.action-pins.result }}"
        sc="${{ needs.security.result }}"
        pi="${{ needs.pin-impact.result }}"
        for result in "$vl" "$tt" "$bb" "$db" "$cc" "$dg" "$ap" "$sc" "$pi"; do
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "Required job failed or was cancelled (result: $result)"
            exit 1
          fi
        done

  # =============================================================================
  # Stage 5: Cross-Platform Build (main/release only)
  # =============================================================================

  cross-platform:
    name: Cross-Platform Build
    runs-on: autops-kube-kure
    timeout-minutes: 15
    needs: build-binaries
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    strategy:
      fail-fast: false
      matrix:
        os: [linux]
        arch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build tools
      run: command -v make &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends make)

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT
        echo "Using Go version: $GO_VER"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        cache: false

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-gomod-

    # Source-aware Go build cache, scoped per target arch (cross-compiled arm64 artifacts
    # differ from amd64, so matrix.arch is part of the key — runner.arch is the host arch
    # and is identical across legs).
    - name: Restore Go build cache
      id: gocache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-build-${{ matrix.os }}-${{ matrix.arch }}-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'Makefile', '**/testdata/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-build-${{ matrix.os }}-${{ matrix.arch }}-deps-${{ hashFiles('go.mod', 'go.sum') }}-src-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-version.outputs.version }}-gocache-build-${{ matrix.os }}-${{ matrix.arch }}-

    - name: Log Go build cache restore
      run: |
        echo "cache-hit=${{ steps.gocache.outputs.cache-hit }}"
        echo "primary-key=${{ steps.gocache.outputs.cache-primary-key }}"
        echo "matched-key=${{ steps.gocache.outputs.cache-matched-key }}"

    - name: Install dependencies
      run: make deps

    - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')

        if [ "${{ matrix.os }}" = "windows" ]; then
          EXT=".exe"
        else
          EXT=""
        fi

        mkdir -p bin
        go build -ldflags="-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildTime=${BUILD_TIME}" \
          -o bin/kurel-${{ matrix.os }}-${{ matrix.arch }}${EXT} ./cmd/kurel

    - name: Save Go build cache
      if: success() && steps.gocache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/go-build
        key: ${{ steps.gocache.outputs.cache-primary-key }}

    - name: Upload cross-platform artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: binaries-${{ matrix.os }}-${{ matrix.arch }}
        path: bin/*
        retention-days: 30

  # =============================================================================
  # PR-only Jobs (parallel, non-blocking)
  # =============================================================================

  analyze-changes:
    name: Analyze Changes
    runs-on: autops-kube-kure
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          **.go
          go.mod
          go.sum
          Makefile
          .github/workflows/**.yml

    - name: Analyze Go changes
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Changed Go-related files:"
        echo "${{ steps.changed-files.outputs.all_changed_files }}"

        # Count lines of code changes
        ADDED_LINES=$(git diff --numstat origin/main...HEAD | awk '{added+=$1} END {print added+0}')
        REMOVED_LINES=$(git diff --numstat origin/main...HEAD | awk '{removed+=$2} END {print removed+0}')

        echo "Lines added: $ADDED_LINES"
        echo "Lines removed: $REMOVED_LINES"

        # Check if this is a major change
        if [ "$ADDED_LINES" -gt 500 ] || [ "$REMOVED_LINES" -gt 500 ]; then
          echo "::notice::This is a major change (500+ lines). Consider breaking it into smaller PRs."
        fi

    - name: Check for breaking changes
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # Look for potential breaking changes in public APIs
        if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -E "pkg/.*\.go$"; then
          echo "::warning::Changes detected in pkg/ directory. Review for potential breaking changes to public API."
        fi
