name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'DEVELOPMENT.md'
      - 'scripts/gen-versions-toml.sh'
  workflow_dispatch:
    inputs:
      version_slot:
        description: 'Target subdirectory (e.g., dev, v0.1)'
        required: true
        type: string
      version_label:
        description: 'Version label for Hugo params (e.g., v0.1.0, dev)'
        required: true
        type: string
      set_latest:
        description: 'Also deploy to root / as the latest stable'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One deploy per version slot at a time
concurrency:
  group: deploy-docs-${{ inputs.version_slot || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: autops-kube-kure
    timeout-minutes: 10

    steps:
    # No later step authenticates to this repository: it is public, and the
    # deploy action's tag fetch from it needs no token.
    - name: Checkout launcher repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make

    # Dispatch inputs are bound to env vars, not interpolated into the run:
    # script, so a value is passed as data and never parsed as shell syntax.
    # Each is checked before it reaches GITHUB_OUTPUT: the slot by the rule the
    # deploy-docs-push action applies (one path segment, dev or v*), the label
    # as dev or a release tag (a release tag only with set_latest true),
    # set_latest as true or false.
    - name: Determine version parameters
      id: version
      env:
        VERSION_SLOT: ${{ inputs.version_slot }}
        VERSION_LABEL: ${{ inputs.version_label }}
        SET_LATEST: ${{ inputs.set_latest }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          if [[ ! "$VERSION_SLOT" =~ ^(dev|v[A-Za-z0-9._-]*)$ ]]; then
            echo "::error::version_slot must be dev or one path segment starting with v (e.g. v0.1)"
            exit 1
          fi
          if [[ ! "$VERSION_LABEL" =~ ^(dev|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::version_label must be dev or a release tag (e.g. v0.1.0, v0.1.0-alpha.23)"
            exit 1
          fi
          if [[ "$SET_LATEST" != "true" && "$SET_LATEST" != "false" ]]; then
            echo "::error::set_latest must be true or false"
            exit 1
          fi
          if [[ "$SET_LATEST" == "true" && "$VERSION_LABEL" == "dev" ]]; then
            echo "::error::set_latest=true needs a release tag as version_label, not dev"
            exit 1
          fi
          {
            echo "slot=$VERSION_SLOT"
            echo "label=$VERSION_LABEL"
            echo "set_latest=$SET_LATEST"
          } >> "$GITHUB_OUTPUT"
        else
          # Push to main → dev build
          {
            echo "slot=dev"
            echo "label=dev"
            echo "set_latest=false"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Read Hugo version from mise.toml
      id: hugo-version
      run: |
        HUGO_VER=$(grep '^hugo = ' mise.toml | sed 's/hugo = "\(.*\)"/\1/')
        if [ -z "$HUGO_VER" ]; then
          echo "::error::Failed to parse Hugo version from mise.toml"
          exit 1
        fi
        echo "version=$HUGO_VER" >> $GITHUB_OUTPUT

    - name: Install Hugo CLI
      run: |
        curl -fsSL -o ${{ runner.temp }}/hugo.deb \
          https://github.com/gohugoio/hugo/releases/download/v${{ steps.hugo-version.outputs.version }}/hugo_extended_${{ steps.hugo-version.outputs.version }}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

    - name: Read Go version from mise.toml
      id: go-version
      run: |
        GO_VER=$(grep '^go = ' mise.toml | sed 's/go = "\(.*\)"/\1/')
        echo "version=$GO_VER" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true

    - name: Read yq version from mise.toml
      id: yq-version
      run: |
        YQ_VER=$(grep '^yq = ' mise.toml | sed 's/yq = "\(.*\)"/\1/')
        if [ -z "$YQ_VER" ]; then
          echo "::error::Failed to parse yq version from mise.toml"
          exit 1
        fi
        echo "version=$YQ_VER" >> $GITHUB_OUTPUT

    - name: Cache yq
      id: yq-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/bin/yq
        key: yq-${{ steps.yq-version.outputs.version }}-linux-amd64

    - name: Install yq
      if: steps.yq-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/bin
        curl -fsSL -o ~/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v${{ steps.yq-version.outputs.version }}/yq_linux_amd64
        chmod +x ~/bin/yq
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Add yq to PATH
      if: steps.yq-cache.outputs.cache-hit == 'true'
      run: echo "$HOME/bin" >> $GITHUB_PATH

    - name: Validate docs map (code↔docs sync)
      uses: go-kure/.github/.github/actions/check-doc-sync@27e992335867858c0a7cc2dd2f48d1eabe5fb057 # main

    - name: Inject front matter
      run: bash site/scripts/inject-frontmatter.sh

    - name: Generate versions config overlay
      env:
        VERSION_LABEL: ${{ steps.version.outputs.label }}
      run: bash scripts/gen-versions-toml.sh --version "$VERSION_LABEL"

    - name: Build Hugo site (versioned slot)
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
        SLOT: ${{ steps.version.outputs.slot }}
      run: |
        hugo --config hugo.toml,versions.toml --minify --baseURL "https://www.gokure.dev/launcher/${SLOT}/"
        # Save for deploy
        mv public public-slot

    - name: Build Hugo site (launcher/ root — latest)
      if: steps.version.outputs.set_latest == 'true'
      working-directory: site
      env:
        HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        HUGO_ENVIRONMENT: production
      run: |
        hugo --config hugo.toml,versions.toml --minify --baseURL "https://www.gokure.dev/launcher/"
        mv public public-root

    # Credentials stay persisted here on purpose: the deploy-docs-push action
    # pushes with the checkout's own credential. This checkout runs after both
    # Hugo builds, so the deploy step is the only one that can read the token.
    - name: Checkout go-kure.github.io # zizmor: ignore[artipacked]
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: go-kure/go-kure.github.io
        token: ${{ secrets.DEPLOY_TOKEN }}
        path: deploy-target

    # Writes launcher/<slot>/ and, when set_latest is true, the launcher/ root,
    # then commits and pushes. The root is written only if the label is still the
    # highest stable tag at write time (tags fetched again); a push rejected
    # because another slot's deploy moved the pages tip is redone on the new tip
    # and retried.
    - name: Deploy to go-kure.github.io
      uses: go-kure/.github/.github/actions/deploy-docs-push@27e992335867858c0a7cc2dd2f48d1eabe5fb057 # main
      with:
        source-path: .
        target-path: deploy-target
        site-subdir: launcher
        slot: ${{ steps.version.outputs.slot }}
        label: ${{ steps.version.outputs.label }}
        set-latest: ${{ steps.version.outputs.set_latest }}
        slot-site: site/public-slot
        root-site: site/public-root
