apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-cronjob
spec:
  components:
  - name: cleanup
    type: cronjob
    properties:
      schedule: "0 2 * * *"
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers:
              - name: cleanup
                image: myregistry/my-cronjob:v1.2.3
