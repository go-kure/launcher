# Not buildable with `kurel build` as-is, by design: the hostPath volume below is
# default-deny. `kurel build` supplies no Policy, so NoopPolicy applies and
# AllowHostPathVolumes() is false. The example shows the node-agent shape; a host
# that permits hostPath supplies its own Policy.
apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: node-agent
spec:
  components:
  - name: agent
    type: daemonset
    # A daemonset takes the upstream DaemonSetSpec: `selector` and `template` are
    # required, and the pod is written as Kubernetes shapes it, under
    # `template.spec`. Launcher adds the `app: agent` label to the pod template
    # (it is written here to match the selector) and fills no default.
    properties:
      selector:
        matchLabels:
          app: agent
      template:
        metadata:
          labels:
            app: agent
        spec:
          containers:
          - name: agent
            image: myregistry/node-agent:v1.0.0
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
            volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          volumes:
          - name: host-proc
            hostPath:
              path: /proc
