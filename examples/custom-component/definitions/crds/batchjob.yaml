# A small CustomResourceDefinition written for this example. It stands in for the file a
# real operator ships: copy that file next to the ComponentDefinition and pin its digest.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: batchjobs.example.gokure.dev
spec:
  group: example.gokure.dev
  names:
    kind: BatchJob
    listKind: BatchJobList
    plural: batchjobs
    singular: batchjob
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - image
            - mode
            properties:
              image:
                type: string
                minLength: 1
              mode:
                type: string
                enum:
                - batch
                - stream
              parallelism:
                type: integer
                minimum: 1
                maximum: 64
              port:
                x-kubernetes-int-or-string: true
              resources:
                type: object
                properties:
                  cpu:
                    type: string
                  memory:
                    type: string
              env:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                    value:
                      type: string
