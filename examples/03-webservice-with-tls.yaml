apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
spec:
  components:
  - name: web
    type: webservice
    properties:
      image: myregistry/my-app:v1.2.3
      port: 8080
      replicas: 2
    traits:
    # expose does not take a `tls` block. Ingress TLS is platform-managed: it is
    # synthesized only when the ClusterProfile grants the expose capability a
    # `certManagerClusterIssuer`, and the trait then accepts at most a `secretName`
    # to override the generated <component>-tls name. The certificate trait below is
    # the other route — an explicit cert-manager Certificate this document controls.
    - type: expose
      properties:
        rules:
        - host: my-app.example.com
          paths:
          - path: /
            port: 8080
    - type: certificate
      properties:
        secretName: my-app-tls
        dnsNames:
        - my-app.example.com
