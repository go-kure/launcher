apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: blue
      type: cilium-loadbalancerippool
      properties:
        serviceSelector:
          matchLabels:
            pool: blue
          matchExpressions:
            - key: tier
              operator: In
              values: [frontend, edge]
        allowFirstLastIPs: "No"
        blocks:
          - cidr: 192.0.2.0/24
          - start: 198.51.100.10
            stop: 198.51.100.20
        disabled: true
    - name: everything
      type: cilium-loadbalancerippool
      properties:
        objectName: default-pool
        blocks:
          - cidr: 203.0.113.0/24
        disabled: false
