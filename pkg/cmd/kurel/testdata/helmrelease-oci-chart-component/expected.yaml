apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    launcher.gokure.dev/component: podinfo
  name: podinfo
  namespace: default
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 30m0s
      ref:
        tag: 6.7.0
      timeout: 59m59s
      url: oci://ghcr.io/stefanprodan/charts/podinfo
      verify:
        matchOIDCIdentity:
        - issuer: ^https://token.actions.githubusercontent.com$
          subject: ^https://github.com/stefanprodan/podinfo.*$
        provider: cosign
  interval: 10m0s
  postRenderers:
  - kustomize:
      patches:
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: Deployment
          version: v1
      - patch: |
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: StatefulSet
          version: v1
      - patch: |
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: DaemonSet
          version: v1
      - patch: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: batch
          kind: Job
          version: v1
      - patch: |
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: component-label
          spec:
            jobTemplate:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
              spec:
                template:
                  metadata:
                    labels:
                      launcher.gokure.dev/component: podinfo
        target:
          group: batch
          kind: CronJob
          version: v1
      - patch: |
          apiVersion: apps/v1
          kind: ReplicaSet
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: ReplicaSet
          version: v1
      - patch: |
          apiVersion: v1
          kind: ReplicationController
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: ^$
          kind: ReplicationController
          version: v1
      - patch: |
          apiVersion: v1
          kind: PodTemplate
          metadata:
            name: component-label
          template:
            metadata:
              labels:
                launcher.gokure.dev/component: podinfo
        target:
          group: ^$
          kind: PodTemplate
          version: v1
      - patch: |
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              launcher.gokure.dev/component: podinfo
            name: component-label
        target:
          group: ^$
          kind: Pod
          version: v1
  releaseName: podinfo
  values:
    replicaCount: 2
