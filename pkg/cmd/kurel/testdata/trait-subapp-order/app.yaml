apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    # A trait sub-application follows its own component, not every component:
    # the claim api-cache comes right after api's objects, before the worker
    # api-data's (go-kure/launcher#712). The claim is named apart from the
    # worker: two applications of one name in one bundle are refused
    # (go-kure/launcher#787).
    - name: api
      type: webservice
      properties:
        image: ghcr.io/example/api:v1.0.0
        port: 8080
      traits:
        - type: pvc
          properties:
            name: api-cache
            size: 5Gi
    - name: api-data
      type: worker
      properties:
        image: ghcr.io/example/worker:v1.0.0
