apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: migrate
  name: migrate
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: migrate
    spec:
      containers:
      - image: ghcr.io/example/migrate:v1.0.0
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: OnFailure
      serviceAccountName: migrate
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: migrate
  name: migrate
  namespace: default
