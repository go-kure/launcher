apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: orders
      type: cnpg-databaserole
      properties:
        cluster:
          name: postgres
        name: orders
        comment: The orders service's role.
        login: true
        inherit: false
        connectionLimit: 20
        validUntil: "2030-01-01T02:00:00+02:00"
        inRoles: [pg_monitor]
        passwordSecret:
          name: orders-password
        databaseRoleReclaimPolicy: delete
    - name: readers
      type: cnpg-databaserole
      properties:
        objectName: postgres-readers
        cluster:
          name: postgres
        name: readers
