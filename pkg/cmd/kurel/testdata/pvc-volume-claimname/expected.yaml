apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: media
    launcher.gokure.dev/component: media
  name: media
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
    launcher.gokure.dev/component: api
  name: api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy: {}
  template:
    metadata:
      labels:
        app: api
        launcher.gokure.dev/component: api
    spec:
      containers:
      - image: ghcr.io/example/api:v1.0.0
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /media
          name: media
      serviceAccountName: api
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: api
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app: api
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: media
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api
    launcher.gokure.dev/component: api
  name: api
  namespace: default
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: api
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: api
    launcher.gokure.dev/component: api
  name: api
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: indexer
    launcher.gokure.dev/component: indexer
  name: indexer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: indexer
        launcher.gokure.dev/component: indexer
    spec:
      containers:
      - image: ghcr.io/example/indexer:v1.0.0
        name: indexer
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /media
          name: media
          readOnly: true
      serviceAccountName: indexer
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: media
          readOnly: true
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: indexer
    launcher.gokure.dev/component: indexer
  name: indexer
  namespace: default
