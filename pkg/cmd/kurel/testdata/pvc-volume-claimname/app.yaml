apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: media
      type: persistentvolumeclaim
      properties:
        size: 20Gi
        accessModes:
          - ReadWriteMany
    - name: api
      type: webservice
      properties:
        image: ghcr.io/example/api:v1.0.0
        port: 8080
        replicas: 3
        volumes:
          - name: media
            type: pvc
            mountPath: /media
            claimName: media
            accessModes:
              - ReadWriteMany
    - name: indexer
      type: worker
      properties:
        image: ghcr.io/example/indexer:v1.0.0
        volumes:
          - name: media
            type: pvc
            mountPath: /media
            readOnly: true
            claimName: media
