apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  labels:
    launcher.gokure.dev/component: edge
  name: edge
  namespace: metallb-system
spec:
  addresses:
  - 192.0.2.0/24
  - 198.51.100.10-198.51.100.20
  - 2001:db8::/64
  autoAssign: false
  avoidBuggyIPs: true
  serviceAllocation:
    namespaceSelectors:
    - matchLabels:
        tier: edge
    namespaces:
    - shop
    - payments
    priority: 10
    serviceSelectors:
    - matchExpressions:
      - key: tier
        operator: In
        values:
        - edge
        - dmz
      matchLabels:
        exposure: public
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  labels:
    launcher.gokure.dev/component: shared
  name: every-service
  namespace: metallb-system
spec:
  addresses:
  - 203.0.113.0/24
