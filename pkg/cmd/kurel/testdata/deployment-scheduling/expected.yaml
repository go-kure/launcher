apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
    launcher.gokure.dev/component: backend
  name: backend
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
        launcher.gokure.dev/component: backend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: node-role.kubernetes.io/spot
                operator: DoesNotExist
            weight: 40
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: backend
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/example/backend:v1.0.0
        name: backend
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: batch
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 300
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: backend
        maxSkew: 1
        minDomains: 2
        nodeTaintsPolicy: Honor
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
