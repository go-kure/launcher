apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    launcher.gokure.dev/component: podinfo
  name: podinfo
  namespace: default
spec:
  chart:
    spec:
      chart: ./charts/podinfo
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: podinfo
        namespace: flux-system
  interval: 1h0m0s
  postRenderers:
  - kustomize:
      patches:
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: Deployment
          version: v1
      - patch: |
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: StatefulSet
          version: v1
      - patch: |
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: DaemonSet
          version: v1
      - patch: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: batch
          kind: Job
          version: v1
      - patch: |
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: component-label
          spec:
            jobTemplate:
              spec:
                template:
                  metadata:
                    labels:
                      launcher.gokure.dev/component: podinfo
        target:
          group: batch
          kind: CronJob
          version: v1
      - patch: |
          apiVersion: apps/v1
          kind: ReplicaSet
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          group: apps
          kind: ReplicaSet
          version: v1
      - patch: |
          apiVersion: v1
          kind: ReplicationController
          metadata:
            name: component-label
          spec:
            template:
              metadata:
                labels:
                  launcher.gokure.dev/component: podinfo
        target:
          kind: ReplicationController
          version: v1
      - patch: |
          apiVersion: v1
          kind: PodTemplate
          metadata:
            name: component-label
          template:
            metadata:
              labels:
                launcher.gokure.dev/component: podinfo
        target:
          kind: PodTemplate
          version: v1
      - patch: |
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              launcher.gokure.dev/component: podinfo
            name: component-label
        target:
          kind: Pod
          version: v1
---
