apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: default
spec:
  chart:
    spec:
      chart: ./charts/podinfo
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: podinfo
        namespace: flux-system
  interval: 1h0m0s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exporter
  namespace: default
spec:
  chart:
    spec:
      chart: charts/exporter
      reconcileStrategy: Revision
      sourceRef:
        kind: Bucket
        name: chart-artifacts
  interval: 1h0m0s
