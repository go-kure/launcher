apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: default
spec:
  components:
    - name: podinfo
      type: helm
      properties:
        chart: ./charts/podinfo
        source:
          kind: GitRepository
          name: podinfo
          namespace: flux-system
    - name: exporter
      type: helm
      properties:
        chart: charts/exporter
        source:
          kind: Bucket
          name: chart-artifacts
