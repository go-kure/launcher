apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    launcher.gokure.dev/component: postgres
  name: postgres
  namespace: default
spec:
  affinity: {}
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 1
  plugins:
  - isWALArchiver: true
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: postgres
  postgresql:
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateStrategy: unsupervised
  resources: {}
  storage:
    size: 10Gi
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  labels:
    launcher.gokure.dev/component: postgres
  name: postgres
  namespace: default
spec:
  configuration:
    destinationPath: s3://my-bucket/postgres/
    s3Credentials:
      inheritFromIAMRole: true
  instanceSidecarConfiguration:
    resources: {}
