apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: test-db
  namespace: default
spec:
  components:
  - name: postgres
    type: postgresql
    properties:
      version: "16"
      storageSize: "10Gi"
      backup:
        objectStore:
          destinationPath: s3://my-bucket/postgres/
          s3Credentials:
            inheritFromIAMRole: true
