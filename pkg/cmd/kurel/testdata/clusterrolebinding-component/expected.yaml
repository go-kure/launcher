apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    launcher.gokure.dev/component: node-reader
  name: node-reader
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    launcher.gokure.dev/component: read-nodes
  name: read-nodes
roleRef:
  apiGroup: ""
  kind: ClusterRole
  name: node-reader
subjects:
- kind: ServiceAccount
  name: web
  namespace: default
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: ops
