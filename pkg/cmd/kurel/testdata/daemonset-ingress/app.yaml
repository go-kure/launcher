apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: default
spec:
  components:
    - name: agent
      type: daemonset
      properties:
        image: ghcr.io/example/agent:v1.0
        ports:
          - name: http
            containerPort: 9090
    - name: agent-http
      type: service
      properties:
        selector:
          app: agent
        ports:
          - name: http
            port: 9090
      traits:
        - type: ingress
          properties:
            ingressClassName: nginx
            rules:
              - host: agent.example.com
                paths:
                  - path: /metrics
