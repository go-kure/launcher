apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: minimal
      type: replicaset
      properties:
        selector:
          matchLabels:
            app: minimal
        template:
          spec:
            containers:
              - name: app
                image: ghcr.io/example/app:v1.0.0
    - name: web
      type: replicaset
      properties:
        replicas: 3
        minReadySeconds: 5
        selector:
          matchLabels:
            tier: web
          matchExpressions:
            - key: track
              operator: In
              values: [stable, canary]
        template:
          metadata:
            labels:
              tier: web
              track: stable
            annotations:
              example.com/scrape: "true"
          spec:
            terminationGracePeriodSeconds: 0
            serviceAccountName: web
            automountServiceAccountToken: false
            nodeSelector:
              kubernetes.io/os: linux
            securityContext:
              runAsNonRoot: true
              fsGroup: 2000
            volumes:
              - name: scratch
                emptyDir: {}
            initContainers:
              - name: wait
                image: ghcr.io/example/wait:v0.3.1
                args: ["--for", "db"]
            containers:
              - name: web
                image: ghcr.io/example/web:v2.1.0
                ports:
                  - name: http
                    containerPort: 8080
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 1
                    memory: 512Mi
                volumeMounts:
                  - name: scratch
                    mountPath: /scratch
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: http
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 2
