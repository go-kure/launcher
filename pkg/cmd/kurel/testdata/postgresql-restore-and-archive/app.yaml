apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: test-db
  namespace: default
spec:
  components:
  - name: postgres
    type: postgresql
    properties:
      version: "16"
      storageSize: "10Gi"
      recovery:
        source:
          serverName: origin
          objectStoreName: postgres
      backup:
        objectStore:
          destinationPath: "s3://my-bucket/backups"
          endpointURL: "https://s3.example.com"
          s3Credentials:
            accessKeyId:
              name: backup-creds
              key: ACCESS_KEY_ID
            secretAccessKey:
              name: backup-creds
              key: SECRET_ACCESS_KEY
        serverName: postgres-v2
        retentionPolicy: "30d"
        schedules:
        - name: nightly
          schedule: "0 0 2 * * *"
