apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: db
    launcher.gokure.dev/component: db
  name: db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  serviceName: ""
  template:
    metadata:
      labels:
        app: db
        launcher.gokure.dev/component: db
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/example/postgres:v15.0
        name: db
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    status: {}
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  labels:
    launcher.gokure.dev/component: db
  name: data-backup
  namespace: default
spec:
  restic:
    copyMethod: Snapshot
    customCA: {}
    pruneIntervalDays: 14
    repository: db-volsync-secret
    retain:
      daily: 7
      monthly: 3
      weekly: 4
  sourcePVC: data
  trigger:
    schedule: '@daily'
