apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: db
      type: statefulset
      properties:
        selector:
          matchLabels:
            app: db
        template:
          spec:
            containers:
              - name: db
                image: ghcr.io/example/postgres:v15.0
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/postgresql/data
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
      traits:
        - type: volsync
          properties:
            sourcePVC: data
            schedule: "@daily"
