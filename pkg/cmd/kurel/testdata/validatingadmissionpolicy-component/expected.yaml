apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    launcher.gokure.dev/component: replica-limit
  name: replica-limit
spec:
  auditAnnotations:
  - key: replicas
    valueExpression: string(object.spec.replicas)
  failurePolicy: Fail
  matchConditions:
  - expression: '!request.userInfo.username.startsWith(''system:'')'
    name: not-system
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: policy.example.com/enforce
        operator: In
        values:
        - "true"
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
  - expression: object.spec.replicas <= variables.maxReplicas
    messageExpression: '''at most '' + string(variables.maxReplicas) + '' replicas'''
    reason: Invalid
  variables:
  - expression: int(params.data.maxReplicas)
    name: maxReplicas
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    launcher.gokure.dev/component: audit-only
  name: audit-deletes.example.com
spec:
  auditAnnotations:
  - key: deleted-by
    valueExpression: request.userInfo.username
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - DELETE
      resources:
      - namespaces
