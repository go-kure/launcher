apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: default
spec:
  affinity: {}
  bootstrap:
    pg_basebackup:
      source: origin
  enablePDB: true
  externalClusters:
  - barmanObjectStore:
      destinationPath: s3://origin-bucket/postgres/
      endpointURL: https://s3.example.com
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: origin-backup-creds
        secretAccessKey:
          key: SECRET_ACCESS_KEY
          name: origin-backup-creds
      serverName: origin
      wal:
        maxParallel: 4
    connectionParameters:
      dbname: postgres
      host: origin-rw.default.svc
      user: streaming_replica
    name: origin
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 2
  managed:
    roles:
    - connectionLimit: 25
      login: true
      name: app_user
      passwordSecret:
        name: app-db-creds
    - ensure: absent
      name: legacy_user
  plugins:
  - isWALArchiver: true
    name: barman-cloud.barmancloud.cnpg.io
    parameters:
      objectStoreName: postgres
  postgresql:
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 500m
  storage:
    size: 10Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler
  namespace: default
spec:
  cluster:
    name: postgres
  pgbouncer:
    poolMode: session
  type: ro
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres
  namespace: default
spec:
  configuration:
    destinationPath: s3://my-bucket/postgres/
    endpointURL: https://s3.example.com
    s3Credentials:
      accessKeyId:
        key: ACCESS_KEY_ID
        name: postgres-backup-creds
      secretAccessKey:
        key: SECRET_ACCESS_KEY
        name: postgres-backup-creds
    serverName: postgres
  instanceSidecarConfiguration:
    resources: {}
  retentionPolicy: 14d
