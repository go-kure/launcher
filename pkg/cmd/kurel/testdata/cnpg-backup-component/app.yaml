apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: before-upgrade
      type: cnpg-backup
      properties:
        cluster:
          name: postgres
        target: prefer-standby
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
          parameters:
            compression: gzip
    - name: snapshot
      type: cnpg-backup
      properties:
        objectName: postgres-snapshot
        cluster:
          name: postgres
        method: volumeSnapshot
        online: false
