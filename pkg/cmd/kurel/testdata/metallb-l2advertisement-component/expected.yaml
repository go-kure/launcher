apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  labels:
    launcher.gokure.dev/component: edge
  name: edge
  namespace: metallb-system
spec:
  interfaces:
  - eth1
  - eth2
  ipAddressPoolSelectors:
  - matchLabels:
      tier: edge
  ipAddressPools:
  - edge
  - shared
  nodeSelectors:
  - matchExpressions:
    - key: zone
      operator: In
      values:
      - a
      - b
    matchLabels:
      role: edge
  serviceSelectors:
  - matchLabels:
      exposure: public
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  labels:
    launcher.gokure.dev/component: everything
  name: every-pool
  namespace: metallb-system
spec: {}
