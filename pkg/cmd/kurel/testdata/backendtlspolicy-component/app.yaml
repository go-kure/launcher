apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: payments
      type: backendtlspolicy
      properties:
        targetRefs:
          - group: ""
            kind: Service
            name: payments
            sectionName: https
        validation:
          hostname: payments.internal.example.com
          caCertificateRefs:
            - group: ""
              kind: ConfigMap
              name: internal-ca
          subjectAltNames:
            - type: URI
              uri: spiffe://example.com/payments
        options:
          example.com/min-version: "1.3"
    - name: upstream
      type: backendtlspolicy
      properties:
        objectName: upstream-public-ca
        targetRefs:
          - group: ""
            kind: Service
            name: upstream
        validation:
          hostname: api.example.org
          wellKnownCACertificates: System
