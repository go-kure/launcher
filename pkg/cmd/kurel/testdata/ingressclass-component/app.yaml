apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: external
      type: ingressclass
      properties:
        controller: k8s.io/ingress-nginx
        parameters:
          apiGroup: k8s.example.com
          kind: IngressParameters
          name: external
          scope: Namespace
          namespace: ingress
    - name: internal
      type: ingressclass
      properties:
        controller: k8s.io/ingress-nginx
