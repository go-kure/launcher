apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: metallb-system
spec:
  components:
    - name: fast
      type: metallb-bfdprofile
      properties:
        receiveInterval: 300
        transmitInterval: 300
        echoInterval: 50
        detectMultiplier: 3
        echoMode: false
        passiveMode: true
        minimumTtl: 254
    - name: defaults
      type: metallb-bfdprofile
      properties:
        objectName: unset
