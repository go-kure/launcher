apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  labels:
    launcher.gokure.dev/component: routes-to-services
  name: routes-to-services
  namespace: default
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: shop
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  labels:
    launcher.gokure.dev/component: gateway-to-certificate
  name: edge-reads-wildcard-tls
  namespace: default
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: edge
  to:
  - group: ""
    kind: Secret
    name: wildcard-tls
