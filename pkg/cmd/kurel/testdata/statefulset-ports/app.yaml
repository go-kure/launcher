apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-db
  namespace: default
spec:
  components:
    - name: db
      type: statefulset
      properties:
        selector:
          matchLabels:
            app: db
        template:
          spec:
            containers:
              - name: db
                image: ghcr.io/example/postgres:v15.0
                ports:
                  - name: tcp
                    containerPort: 5432
                  - name: metrics
                    containerPort: 9187
                readinessProbe:
                  tcpSocket:
                    port: tcp
                livenessProbe:
                  httpGet:
                    path: /metrics
                    port: metrics
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/postgresql/data
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
