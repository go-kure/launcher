apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: db
    launcher.gokure.dev/component: db
  name: db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  serviceName: ""
  template:
    metadata:
      labels:
        app: db
        launcher.gokure.dev/component: db
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/example/postgres:v15.0
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
        name: db
        ports:
        - containerPort: 5432
          name: tcp
          protocol: TCP
        - containerPort: 9187
          name: metrics
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: tcp
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    status: {}
