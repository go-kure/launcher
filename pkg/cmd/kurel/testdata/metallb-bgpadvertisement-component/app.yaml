apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: metallb-system
spec:
  components:
    - name: edge
      type: metallb-bgpadvertisement
      properties:
        aggregationLength: 24
        aggregationLengthV6: 64
        localPref: 100
        communities: ["64512:100", no-export]
        ipAddressPools: [edge, shared]
        ipAddressPoolSelectors:
          - matchLabels:
              tier: edge
        nodeSelectors:
          - matchLabels:
              role: edge
            matchExpressions:
              - key: zone
                operator: In
                values: [a, b]
        peers: [upstream-a, upstream-b]
    - name: public
      type: metallb-bgpadvertisement
      properties:
        objectName: public-services
        serviceSelectors:
          - matchLabels:
              exposure: public
    - name: everything
      type: metallb-bgpadvertisement
      properties:
        objectName: every-pool
