apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: minimal
      type: pod
      properties:
        containers:
          - name: app
            image: ghcr.io/example/app:v1.0.0
    - name: migrate
      type: pod
      properties:
        restartPolicy: OnFailure
        terminationGracePeriodSeconds: 0
        activeDeadlineSeconds: 600
        serviceAccountName: migrator
        automountServiceAccountToken: false
        priorityClassName: batch
        nodeSelector:
          kubernetes.io/os: linux
        tolerations:
          - key: dedicated
            operator: Exists
            effect: NoSchedule
        securityContext:
          runAsNonRoot: true
          fsGroup: 2000
        volumes:
          - name: scratch
            emptyDir: {}
        initContainers:
          - name: wait
            image: ghcr.io/example/wait:v0.3.1
            args: ["--for", "db"]
        containers:
          - name: migrate
            image: ghcr.io/example/migrate:v2.1.0
            ports:
              - name: http
                containerPort: 8080
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 512Mi
            volumeMounts:
              - name: scratch
                mountPath: /scratch
            readinessProbe:
              httpGet:
                path: /ready
                port: http
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 2
