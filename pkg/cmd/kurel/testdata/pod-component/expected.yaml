apiVersion: v1
kind: Pod
metadata:
  name: minimal
  namespace: default
spec:
  containers:
  - image: ghcr.io/example/app:v1.0.0
    name: app
    resources: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: migrate
  namespace: default
spec:
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  containers:
  - image: ghcr.io/example/migrate:v2.1.0
    name: migrate
    ports:
    - containerPort: 8080
      name: http
    readinessProbe:
      httpGet:
        path: /ready
        port: http
      periodSeconds: 5
      timeoutSeconds: 2
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    volumeMounts:
    - mountPath: /scratch
      name: scratch
  initContainers:
  - args:
    - --for
    - db
    image: ghcr.io/example/wait:v0.3.1
    name: wait
    resources: {}
  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: batch
  restartPolicy: OnFailure
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
  serviceAccountName: migrator
  terminationGracePeriodSeconds: 0
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Exists
  volumes:
  - emptyDir: {}
    name: scratch
