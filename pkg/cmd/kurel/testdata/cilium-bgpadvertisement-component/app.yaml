apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: routes
      type: cilium-bgpadvertisement
      properties:
        advertisements:
          - advertisementType: PodCIDR
            attributes:
              communities:
                standard:
                  - "65000:100"
              localPreference: 200
          - advertisementType: CiliumPodIPPool
            selector:
              matchLabels:
                pool: public
          - advertisementType: Service
            service:
              addresses:
                - LoadBalancerIP
                - ClusterIP
              aggregationLengthIPv4: 24
            selector:
              matchExpressions:
                - key: bgp
                  operator: In
                  values:
                    - announce
          - advertisementType: Interface
            interface:
              name: lo
    - name: pod-cidr-only
      type: cilium-bgpadvertisement
      properties:
        objectName: pod-cidrs
        advertisements:
          - advertisementType: PodCIDR
