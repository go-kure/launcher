apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    launcher.gokure.dev/component: cleanup
  name: cleanup
  namespace: default
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        launcher.gokure.dev/component: cleanup
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 4
      completionMode: Indexed
      completions: 3
      parallelism: 2
      template:
        metadata:
          labels:
            app: cleanup
            launcher.gokure.dev/component: cleanup
        spec:
          containers:
          - image: ghcr.io/example/cleanup:v1.0.0
            name: cleanup
            resources: {}
          restartPolicy: OnFailure
      ttlSecondsAfterFinished: 3600
  schedule: '@every 1h30m'
  startingDeadlineSeconds: 120
  suspend: false
  timeZone: Europe/Brussels
