apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-daemon
  namespace: default
spec:
  components:
    - name: agent
      type: daemonset
      properties:
        selector:
          matchLabels:
            app: agent
        template:
          spec:
            containers:
              - name: agent
                image: ghcr.io/example/agent:v1.0.0
