apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    launcher.gokure.dev/component: agent
  name: agent
  namespace: default
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        launcher.gokure.dev/component: agent
    spec:
      containers:
      - image: ghcr.io/example/agent:v1.0.0
        name: agent
        resources: {}
  updateStrategy: {}
