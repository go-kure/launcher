apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels:
    launcher.gokure.dev/component: csi.example.com
  name: csi.example.com
spec:
  attachRequired: false
  fsGroupPolicy: File
  podInfoOnMount: true
  requiresRepublish: true
  seLinuxMount: false
  storageCapacity: true
  tokenRequests:
  - audience: vault
    expirationSeconds: 3600
  volumeLifecycleModes:
  - Persistent
  - Ephemeral
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels:
    launcher.gokure.dev/component: minimal.csi.example.com
  name: minimal.csi.example.com
spec: {}
