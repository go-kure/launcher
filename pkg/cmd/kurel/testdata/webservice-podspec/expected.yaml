apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy: {}
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/example/api:v1.0.0
        imagePullPolicy: IfNotPresent
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
      dnsConfig:
        nameservers:
        - 10.96.0.10
        options:
        - name: ndots
          value: "2"
        - name: edns0
        searches:
        - svc.cluster.local
      dnsPolicy: None
      enableServiceLinks: false
      hostAliases:
      - hostnames:
        - db.local
        - cache.local
        ip: 10.0.0.5
      hostUsers: false
      hostname: api-0
      imagePullSecrets:
      - name: regcred
      nodeSelector:
        kubernetes.io/os: linux
        tier: web
      os:
        name: linux
      preemptionPolicy: Never
      priorityClassName: high-priority
      readinessGates:
      - conditionType: example.com/ready
      resourceClaims:
      - name: gpu
        resourceClaimName: shared-gpu
      - name: scratch
        resourceClaimTemplateName: scratch-template
      resources:
        limits:
          hugepages-2Mi: 100Mi
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      runtimeClassName: gvisor
      schedulerName: custom-scheduler
      schedulingGates:
      - name: example.com/quota
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 1000
        seLinuxChangePolicy: Recursive
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
        - 4000
        supplementalGroupsPolicy: Strict
        sysctls:
        - name: net.core.somaxconn
          value: "1024"
      serviceAccountName: shared-api-sa
      setHostnameAsFQDN: true
      shareProcessNamespace: true
      subdomain: api
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api
  name: api
  namespace: default
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: api
  type: ClusterIP
