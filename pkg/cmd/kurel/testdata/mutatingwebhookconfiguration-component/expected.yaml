apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    launcher.gokure.dev/component: sidecar-injector
  name: sidecar-injector
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: injector
      namespace: sidecar
      path: /mutate
      port: 8443
  name: inject.sidecar.example.com
  objectSelector:
    matchLabels:
      sidecar.example.com/inject: "true"
  reinvocationPolicy: IfNeeded
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    launcher.gokure.dev/component: defaults
  name: defaults.example.com
