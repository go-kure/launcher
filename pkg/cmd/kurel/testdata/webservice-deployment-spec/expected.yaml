apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: default
spec:
  minReadySeconds: 10
  progressDeadlineSeconds: 700
  replicas: 1
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - image: ghcr.io/example/api:v1.0.0
        imagePullPolicy: IfNotPresent
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: api
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api
  name: api
  namespace: default
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: api
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: api
  name: api
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: batch
  name: batch
  namespace: default
spec:
  paused: true
  replicas: 1
  selector:
    matchLabels:
      app: batch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
      - image: ghcr.io/example/batch:v1.0.0
        imagePullPolicy: IfNotPresent
        name: batch
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: batch
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: batch
  name: batch
  namespace: default
