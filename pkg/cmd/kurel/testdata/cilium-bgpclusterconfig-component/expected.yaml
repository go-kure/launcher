apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  labels:
    launcher.gokure.dev/component: rack-a
  name: rack-a
spec:
  bgpInstances:
  - localASN: 65000
    localPort: 179
    name: instance-65000
    peers:
    - name: tor-1
      peerASN: 65010
      peerAddress: 192.0.2.1
      peerConfigRef:
        name: tor
    - autoDiscovery:
        defaultGateway:
          addressFamily: ipv4
        mode: DefaultGateway
      name: gateway
      peerASN: 0
      peerConfigRef:
        name: tor
  nodeSelector:
    matchLabels:
      rack: a
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  labels:
    launcher.gokure.dev/component: every-node
  name: cluster-wide
spec:
  bgpInstances:
  - name: instance-65001
