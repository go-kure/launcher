apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-cronjob
  namespace: default
spec:
  components:
    - name: cleanup
      type: cronjob
      properties:
        schedule: "0 * * * *"
        jobTemplate:
          spec:
            # Job-level deadline (JobSpec) and pod-level deadline (PodSpec) are
            # distinct fields; only Job pods may carry the pod-level one
            # (go-kure/launcher#342).
            activeDeadlineSeconds: 900
            template:
              spec:
                restartPolicy: OnFailure
                activeDeadlineSeconds: 600
                terminationGracePeriodSeconds: 10
                nodeName: batch-node-a
                hostnameOverride: cleanup.batch.example
                schedulingGroup:
                  podGroupName: nightly-batch
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: cleanup
                    image: ghcr.io/example/cleanup:v1.0.0
