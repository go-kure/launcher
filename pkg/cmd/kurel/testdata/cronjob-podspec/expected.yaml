apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    launcher.gokure.dev/component: cleanup
  name: cleanup
  namespace: default
spec:
  jobTemplate:
    metadata:
      labels:
        launcher.gokure.dev/component: cleanup
    spec:
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: cleanup
            launcher.gokure.dev/component: cleanup
        spec:
          activeDeadlineSeconds: 600
          containers:
          - image: ghcr.io/example/cleanup:v1.0.0
            name: cleanup
            resources: {}
          hostnameOverride: cleanup.batch.example
          nodeName: batch-node-a
          restartPolicy: OnFailure
          schedulingGroup:
            podGroupName: nightly-batch
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 10
  schedule: 0 * * * *
