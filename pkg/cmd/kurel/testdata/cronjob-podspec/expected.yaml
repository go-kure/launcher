apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: cleanup
  name: cleanup
  namespace: default
spec:
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: cleanup
    spec:
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: cleanup
        spec:
          activeDeadlineSeconds: 600
          containers:
          - image: ghcr.io/example/cleanup:v1.0.0
            imagePullPolicy: IfNotPresent
            name: cleanup
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 100m
                memory: 128Mi
          hostnameOverride: cleanup.batch.example
          nodeName: batch-node-a
          restartPolicy: OnFailure
          schedulingGroup:
            podGroupName: nightly-batch
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: cleanup
          terminationGracePeriodSeconds: 10
  schedule: 0 * * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: cleanup
  name: cleanup
  namespace: default
