apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: orders
      type: grpcroute
      properties:
        parentRefs:
          - name: public
            namespace: gateways
            sectionName: grpc
        hostnames:
          - api.example.com
        rules:
          - matches:
              - method:
                  service: shop.Orders
                  method: Get
            backendRefs:
              - name: orders
                port: 9090
          - backendRefs:
              - name: orders-v1
                port: 9090
                weight: 9
              - name: orders-v2
                port: 9090
                weight: 1
