apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: frontend
      type: webservice
      properties:
        image: ghcr.io/example/frontend:v1.0.0
        port: 8080
        workingDir: /app
        env:
          - name: LOG_LEVEL
            value: info
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_CPU_LIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.cpu
                divisor: 1m
        envFrom:
          - configMapRef:
              name: frontend-config
            prefix: CFG_
          - secretRef:
              name: frontend-secret
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 128Mi
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo starting"]
          preStop:
            sleep:
              seconds: 5
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            add: ["NET_BIND_SERVICE"]
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
