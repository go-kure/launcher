apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop
  namespace: flux-system
spec:
  healthChecks:
  - apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    name: shop-infra
    namespace: flux-system
  - apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    name: shop-services
    namespace: flux-system
  - apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    name: shop-apps
    namespace: flux-system
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-infra
  namespace: flux-system
spec:
  healthChecks:
  - apiVersion: apps/v1
    kind: DaemonSet
    name: agent
    namespace: shop
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-infra
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-infra
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-infra
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-services
  namespace: flux-system
spec:
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: db
    namespace: shop
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-services
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-services
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-services
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-apps
  namespace: flux-system
spec:
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: web
    namespace: shop
  - apiVersion: apps/v1
    kind: Deployment
    name: api
    namespace: shop
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-apps
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-apps
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-apps
