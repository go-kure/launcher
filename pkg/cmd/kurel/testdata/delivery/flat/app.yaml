apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: shop
spec:
  components:
    - name: web
      type: webservice
      properties:
        image: ghcr.io/example/web:v1.0.0
        port: 8080
    - name: jobs
      type: cronjob
      properties:
        image: ghcr.io/example/jobs:v1.0.0
        schedule: "0 * * * *"
