apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  strategy: {}
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - image: ghcr.io/example/web:v1.0.0
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: web
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: web
  name: web
  namespace: shop
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: web
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: web
  name: web
  namespace: shop
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: jobs
  name: jobs
  namespace: shop
spec:
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: jobs
    spec:
      template:
        metadata:
          labels:
            app: jobs
        spec:
          containers:
          - image: ghcr.io/example/jobs:v1.0.0
            name: jobs
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 100m
                memory: 128Mi
          restartPolicy: OnFailure
          serviceAccountName: jobs
  schedule: 0 * * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app: jobs
  name: jobs
  namespace: shop
