apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-db
  namespace: flux-system
spec:
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: db
    namespace: shop
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-db
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-db
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-db
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-db-pooler
  namespace: flux-system
spec:
  dependsOn:
  - name: shop-db
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-db-pooler
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-db-pooler
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-db-pooler
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-db-orders
  namespace: flux-system
spec:
  dependsOn:
  - name: shop-db
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-db-orders
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-db-orders
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-db-orders
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-api
  namespace: flux-system
spec:
  dependsOn:
  - name: shop-db
  - name: shop-db-pooler
  - name: shop-db-orders
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: api
    namespace: shop
  interval: 1h0m0s
  path: ./
  prune: false
  sourceRef:
    kind: OCIRepository
    name: shop-api
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shop-api
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    tag: v1.0.0
  url: oci://registry.example.com/apps/shop-api
