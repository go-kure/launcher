apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    launcher.gokure.dev/component: cleanup
  name: cleanup
  namespace: default
spec:
  jobTemplate:
    metadata:
      labels:
        launcher.gokure.dev/component: cleanup
    spec:
      template:
        metadata:
          labels:
            app: cleanup
            launcher.gokure.dev/component: cleanup
        spec:
          containers:
          - image: ghcr.io/example/cleanup:v1.0.0
            name: cleanup
            resources: {}
          restartPolicy: OnFailure
  schedule: 0 2 * * *
