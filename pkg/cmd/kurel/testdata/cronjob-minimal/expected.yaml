apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: cleanup
    launcher.gokure.dev/component: cleanup
  name: cleanup
  namespace: default
spec:
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app: cleanup
        launcher.gokure.dev/component: cleanup
    spec:
      template:
        metadata:
          labels:
            app: cleanup
            launcher.gokure.dev/component: cleanup
        spec:
          automountServiceAccountToken: false
          containers:
          - image: ghcr.io/example/cleanup:v1.0.0
            name: cleanup
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 100m
                memory: 128Mi
          restartPolicy: OnFailure
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
