apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-cronjob
  namespace: default
spec:
  components:
    - name: cleanup
      type: cronjob
      properties:
        schedule: "0 2 * * *"
        jobTemplate:
          spec:
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: cleanup
                    image: ghcr.io/example/cleanup:v1.0.0
