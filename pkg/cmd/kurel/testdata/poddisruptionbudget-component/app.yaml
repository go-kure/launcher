apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: web-budget
      type: poddisruptionbudget
      properties:
        maxUnavailable: 25%
        selector:
          matchLabels:
            app: web
          matchExpressions:
            - key: tier
              operator: In
              values:
                - frontend
        unhealthyPodEvictionPolicy: AlwaysAllow
    - name: quorum
      type: poddisruptionbudget
      properties:
        minAvailable: 2
        selector:
          matchLabels:
            app: quorum
    - name: no-eviction
      type: poddisruptionbudget
      properties:
        maxUnavailable: 0
        selector: {}
    - name: minimal
      type: poddisruptionbudget
