apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: test-db
  namespace: default
spec:
  components:
  - name: postgres
    type: postgresql
    properties:
      version: "16"
      storageSize: "10Gi"
      recovery:
        source:
          serverName: origin
          objectStoreName: origin-store
        target:
          lsn: 0/3000060
        database: orders
        owner: orders_owner
        secret:
          name: orders-owner-creds
