apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    launcher.gokure.dev/component: postgres
  name: postgres
  namespace: default
spec:
  affinity: {}
  bootstrap:
    recovery:
      database: orders
      owner: orders_owner
      recoveryTarget:
        targetLSN: 0/3000060
      secret:
        name: orders-owner-creds
      source: postgres-recovery-source
  enablePDB: false
  externalClusters:
  - name: postgres-recovery-source
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: origin-store
        serverName: origin
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  instances: 1
  postgresql:
    syncReplicaElectionConstraint:
      enabled: false
  primaryUpdateStrategy: unsupervised
  resources: {}
  storage:
    size: 10Gi
