apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    launcher.gokure.dev/component: agent
  name: agent
  namespace: default
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        launcher.gokure.dev/component: agent
    spec:
      containers:
      - image: ghcr.io/example/agent:v1.0.0
        livenessProbe:
          tcpSocket:
            port: metrics
        name: agent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        - containerPort: 8125
          protocol: UDP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources: {}
  updateStrategy: {}
