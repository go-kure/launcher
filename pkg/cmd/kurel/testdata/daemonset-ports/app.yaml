apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-daemon
  namespace: default
spec:
  components:
    - name: agent
      type: daemonset
      properties:
        image: ghcr.io/example/agent:v1.0.0
        port: 8080
        ports:
          - name: metrics
            containerPort: 9090
          - containerPort: 8125
            protocol: UDP
        probes:
          readiness:
            httpGet:
              path: /healthz
              port: http
          liveness:
            tcpSocket:
              port: metrics
