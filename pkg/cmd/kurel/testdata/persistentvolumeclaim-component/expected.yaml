apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: media
    launcher.gokure.dev/component: media
  name: media
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: raw
    launcher.gokure.dev/component: raw
  name: raw
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeMode: Block
