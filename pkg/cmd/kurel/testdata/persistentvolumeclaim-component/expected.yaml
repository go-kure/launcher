apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: media
    launcher.gokure.dev/component: media
  name: media
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: raw
    launcher.gokure.dev/component: raw
  name: raw
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeMode: Block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: archive
    launcher.gokure.dev/component: archive
  name: archive
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchExpressions:
    - key: zone
      operator: In
      values:
      - a
      - b
    matchLabels:
      tier: archive
  storageClassName: ""
  volumeName: pv-archive-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: restored
    launcher.gokure.dev/component: restored
  name: restored
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: nightly
  resources:
    requests:
      storage: 5Gi
  volumeAttributesClassName: gold
