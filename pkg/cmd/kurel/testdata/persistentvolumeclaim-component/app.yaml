apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: media
      type: persistentvolumeclaim
      properties:
        size: 20Gi
        storageClassName: fast
        accessModes:
          - ReadWriteMany
    - name: raw
      type: persistentvolumeclaim
      properties:
        size: 1Gi
        storageClassName: ""
        volumeMode: Block
    - name: archive
      type: persistentvolumeclaim
      properties:
        size: 5Gi
        storageClassName: ""
        selector:
          matchLabels:
            tier: archive
          matchExpressions:
            - key: zone
              operator: In
              values:
                - a
                - b
        volumeName: pv-archive-0
    - name: restored
      type: persistentvolumeclaim
      properties:
        size: 5Gi
        dataSourceRef:
          apiGroup: snapshot.storage.k8s.io
          kind: VolumeSnapshot
          name: nightly
        volumeAttributesClassName: gold
