apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  labels:
    launcher.gokure.dev/component: postgresql
  name: postgresql
  namespace: default
spec:
  componentImages:
  - image: ghcr.io/cloudnative-pg/pgbouncer:1.24.0
    key: pgbouncer
  images:
  - extensions:
    - dynamic_library_path:
      - /lib
      extension_control_path:
      - /share
      image:
        pullPolicy: IfNotPresent
        reference: ghcr.io/cloudnative-pg/pgvector:0.8.0
      name: pgvector
    image: ghcr.io/cloudnative-pg/postgresql:17.2
    major: 17
  - image: ghcr.io/cloudnative-pg/postgresql:16.6
    major: 16
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  labels:
    launcher.gokure.dev/component: one
  name: one-major
  namespace: default
spec:
  images:
  - image: ghcr.io/cloudnative-pg/postgresql:17.2
    major: 17
