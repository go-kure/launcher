apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-db
  namespace: default
spec:
  components:
    - name: db
      type: statefulset
      properties:
        image: ghcr.io/example/postgres:v15.0
        ports:
          - name: tcp
            containerPort: 5432
        serviceName: db-headless
        volumeClaimTemplates:
          - name: data
            size: 10Gi
            mountPath: /var/lib/postgresql/data
    - name: db-headless
      type: service
      properties:
        clusterIP: None
        selector:
          app: db
        ports:
          - name: tcp
            port: 5432
