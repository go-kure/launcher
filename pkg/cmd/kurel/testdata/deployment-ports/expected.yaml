apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    launcher.gokure.dev/component: api
  name: api
  namespace: default
spec:
  selector:
    matchLabels:
      app: api
  strategy: {}
  template:
    metadata:
      labels:
        app: api
        launcher.gokure.dev/component: api
    spec:
      containers:
      - image: ghcr.io/example/api:v1.0.0
        lifecycle:
          preStop:
            httpGet:
              path: /drain
              port: http
        livenessProbe:
          tcpSocket:
            port: metrics
        name: api
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        - containerPort: 5353
          protocol: UDP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources: {}
