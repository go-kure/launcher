apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: api
      type: deployment
      properties:
        image: ghcr.io/example/api:v1.0.0
        ports:
          - name: http
            containerPort: 8080
          - name: metrics
            containerPort: 9090
          - containerPort: 5353
            protocol: UDP
        probes:
          readiness:
            httpGet:
              path: /healthz
              port: http
          liveness:
            tcpSocket:
              port: metrics
        lifecycle:
          preStop:
            httpGet:
              path: /drain
              port: http
