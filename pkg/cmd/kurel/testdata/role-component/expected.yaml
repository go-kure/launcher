apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    launcher.gokure.dev/component: pod-reader
  name: pod-reader
  namespace: default
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resourceNames:
  - web
  resources:
  - deployments
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    launcher.gokure.dev/component: grants-nothing
  name: empty
  namespace: default
rules: null
