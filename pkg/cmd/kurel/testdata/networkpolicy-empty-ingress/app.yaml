apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: api
      type: webservice
      properties:
        image: ghcr.io/example/api:v1.0.0
        port: 8080
      traits:
        - type: networkpolicy
          properties:
            # An empty list isolates ingress and permits nothing; it must still list
            # Ingress in policyTypes beside a non-empty egress (go-kure/launcher#467).
            ingress: []
            egress:
              - to:
                  - ipBlock:
                      cidr: 10.0.0.0/8
