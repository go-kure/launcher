apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: letsencrypt
      type: issuer
      properties:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: ops@example.com
          privateKeySecretRef:
            name: letsencrypt-account
          solvers:
            - selector:
                dnsZones:
                  - example.com
              http01:
                ingress:
                  ingressClassName: nginx
                  podTemplate:
                    spec:
                      nodeSelector:
                        kubernetes.io/os: linux
                      resources:
                        limits:
                          cpu: 100m
                          memory: 64Mi
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: cloudflare
                    key: token
    - name: internal-ca
      type: issuer
      properties:
        ca:
          secretName: ca-key-pair
    - name: selfsigned
      type: issuer
      properties:
        selfSigned: {}
