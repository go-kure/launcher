apiVersion: batch/v1
kind: Job
metadata:
  labels:
    launcher.gokure.dev/component: migrate
  name: migrate
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: migrate
        launcher.gokure.dev/component: migrate
    spec:
      containers:
      - image: ghcr.io/example/migrate:v1.0.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
        name: migrate
        ports:
        - containerPort: 9090
          name: metrics
        resources: {}
      restartPolicy: OnFailure
