apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-job
  namespace: default
spec:
  components:
    - name: migrate
      type: job
      properties:
        image: ghcr.io/example/migrate:v1.0.0
        ports:
          - name: metrics
            containerPort: 9090
        probes:
          liveness:
            httpGet:
              path: /healthz
              port: metrics
