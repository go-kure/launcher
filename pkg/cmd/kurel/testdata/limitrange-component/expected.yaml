apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: default
spec:
  limits:
  - default:
      cpu: 500m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
    maxLimitRequestRatio:
      cpu: "4"
    min:
      cpu: 50m
    type: Container
  - max:
      storage: 10Gi
    type: PersistentVolumeClaim
---
apiVersion: v1
kind: LimitRange
metadata:
  name: enforces-nothing
  namespace: default
spec:
  limits: []
