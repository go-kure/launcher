apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: team-credentials
      type: clusterexternalsecret
      properties:
        externalSecretName: team-credentials
        namespaceSelectors:
          - matchLabels:
              team: payments
        refreshTime: 1m
        externalSecretMetadata:
          labels:
            team: payments
        externalSecretSpec:
          secretStoreRef:
            name: vault-cluster-store
            kind: ClusterSecretStore
          target:
            name: team-credentials
          data:
            - secretKey: TOKEN
              remoteRef:
                key: prod/team
                property: token
    - name: ca
      type: clusterexternalsecret
      properties:
        objectName: shared-ca
        namespaces:
          - payments
          - billing
        externalSecretSpec:
          secretStoreRef:
            name: vault-cluster-store
            kind: ClusterSecretStore
          dataFrom:
            - extract:
                key: shared/ca
