apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    launcher.gokure.dev/component: shared-data
  name: shared-data
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 10Gi
  mountOptions:
  - nfsvers=4.1
  nfs:
    path: /exports/data
    server: nfs.example.com
  persistentVolumeReclaimPolicy: Retain
  storageClassName: shared
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    launcher.gokure.dev/component: block-data
  name: block-data
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 20Gi
  claimRef:
    name: block-data
    namespace: default
  csi:
    driver: csi.example.com
    fsType: ext4
    volumeHandle: vol-0123
  volumeMode: Block
