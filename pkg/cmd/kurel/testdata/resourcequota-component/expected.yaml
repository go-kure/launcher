apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: default
spec:
  hard:
    limits.memory: 8Gi
    persistentvolumeclaims: "10"
    requests.cpu: "4"
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values:
      - high
  scopes:
  - NotTerminating
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: limits-nothing
  namespace: default
spec: {}
