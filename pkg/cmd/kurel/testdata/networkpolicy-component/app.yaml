apiVersion: launcher.gokure.dev/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: default
spec:
  components:
    - name: db-allow
      type: networkpolicy
      properties:
        podSelector:
          matchLabels:
            role: db
        policyTypes:
          - Ingress
          - Egress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    role: api
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - protocol: TCP
                port: 5432
        egress:
          - to:
              - ipBlock:
                  cidr: 10.0.0.0/8
                  except:
                    - 10.1.0.0/16
            ports:
              - protocol: UDP
                port: 53
    - name: default-deny
      type: networkpolicy
      properties:
        policyTypes:
          - Ingress
