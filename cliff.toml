# git-cliff configuration for Launcher
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
# Scrub downstream/closed-source platform references that leak in from historical
# commit subjects, so the generated changelog never names a downstream consumer
# (org "No Downstream References" rule; enforced by check-forbidden-terms.sh).
# Ordered specific → catch-all; the catch-all is a safety net for stray words.
# The three identifier patterns before it replace a whole identifier that holds a
# term in one of the guard's identifier shapes (go-kure/launcher#1119): a
# capitalised camelCase segment after a lowercase letter, a digit or `_`, not
# followed by a lowercase letter; the leading segment, lower-case or capitalised
# before a capital, a digit or `_`; the upper-case leading segment before a digit
# or `_`.
# The guard's classes are ASCII under the C locale and Unicode under C.UTF-8, and
# it runs in whatever locale its runner sets, so each pattern covers both: Unicode
# letters where C.UTF-8 reads them (\p{Ll}, \p{Lu}), and a non-ASCII word
# character standing as a boundary where C reads one ([^\WA-Za-z0-9_], with \w*
# taking the rest of the identifier). The catch-all does the same for a whole word,
# case-insensitive for the terms only: under (?i) the boundary class would exclude
# a character that folds to an ASCII letter (the Kelvin sign, the long s).
# scripts/test/forbidden-terms-test.sh renders subjects in each shape through
# git-cliff and runs the guard on the result in both locales.
# The terms below are the redaction patterns themselves, not references that leak
# out — same self-referential case the standard grants an escape hatch for.
postprocessors = [
    { pattern = 'wharf\.zone/component', replace = "the platform component label" }, # allow-term:wharf
    { pattern = 'wharf\.zone', replace = "the platform domain" }, # allow-term:wharf
    { pattern = '(?i)\bfrom crane\b', replace = "from the downstream operator" }, # allow-term:crane
    { pattern = '(?i)\bwith crane\b', replace = "with the downstream operator" }, # allow-term:crane
    { pattern = '\w*[\p{Ll}0-9_](Wharf|Crane|Barge|Harbor|Rudder)(?:[^\Wa-z]\w*)?\b', replace = "a downstream identifier" }, # allow-term:wharf allow-term:crane allow-term:barge allow-term:harbor allow-term:rudder
    { pattern = '\w*(?:\b|[^\WA-Za-z0-9_])(wharf|crane|barge|harbor|rudder|Wharf|Crane|Barge|Harbor|Rudder)[\p{Lu}0-9_]\w*', replace = "a downstream identifier" }, # allow-term:wharf allow-term:crane allow-term:barge allow-term:harbor allow-term:rudder
    { pattern = '\w*(?:\b|[^\WA-Za-z0-9_])(WHARF|CRANE|BARGE|HARBOR|RUDDER)[0-9_]\w*', replace = "a downstream identifier" }, # allow-term:wharf allow-term:crane allow-term:barge allow-term:harbor allow-term:rudder
    { pattern = '\w*(?:\b|[^\WA-Za-z0-9_])(?i:wharf|crane|barge|harbor|rudder)(?:\b|[^\WA-Za-z0-9_]\w*)', replace = "the downstream operator" }, # allow-term:wharf allow-term:crane allow-term:barge allow-term:harbor allow-term:rudder
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    # Document-format changes (docs/oam/design-gvk.md "Document-Format Lifecycle") are
    # grouped separately so a consumer re-pinning launcher can scan them without reading
    # every feature line. Must stay ahead of the generic ^feat/^fix/^doc rules below —
    # git-cliff takes the first matching parser.
    { message = "^(feat|fix|refactor|docs?)\\(format\\)", group = "Document Format" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", skip = true },
    # Catch unconventional commits and skip them (case-insensitive)
    { message = "(?i)^wip", skip = true },
    { message = "(?i)^demo", skip = true },
    { message = "(?i)^deps", group = "Dependencies" },
    { message = "(?i)^internal", skip = true },
    { message = "(?i)^resolve", skip = true },
    { message = "(?i)^security", group = "Fixed" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
